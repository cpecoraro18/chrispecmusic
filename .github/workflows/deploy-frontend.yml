name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Delete existing gh-pages branch
        run: git branch -D gh-pages || true
      
      - name: Create new gh-pages branch
        run: git checkout -b gh-pages
      
      - name: Install dependencies and build
        # `npm ci` rather than `npm install`: it installs the exact versions in
        # package-lock.json and fails if the lockfile and package.json disagree.
        # `npm install` is free to resolve newer versions and rewrite the lock,
        # which meant a push that only touched copy could ship an untested
        # dependency bump straight to production — there is no staging here.
        run: |
          cd frontend
          npm ci
          npx nuxi generate
        shell: bash
      
      - name: Move generated files
        run: |
          mv frontend/.output/public/* ./
          rm -rf frontend
          rm -rf backend
          rm -rf .github
        shell: bash
      
      - name: Add CNAME file
        run: echo "chrispecmusic.com" > CNAME
      
      - name: Commit and push changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Deploy"
          git push --force origin gh-pages