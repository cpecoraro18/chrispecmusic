name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Delete existing gh-pages branch
        run: git branch -D gh-pages || true
      
      - name: Create new gh-pages branch
        run: git checkout -b gh-pages
      
      - name: Install dependencies and build
        # `npm ci` rather than `npm install`: it installs the exact versions in
        # package-lock.json and fails if the lockfile and package.json disagree.
        # `npm install` is free to resolve newer versions and rewrite the lock,
        # which meant a push that only touched copy could ship an untested
        # dependency bump straight to production — there is no staging here.
        run: |
          cd frontend
          npm ci
          npx nuxi generate
        shell: bash
      
      - name: Move generated files
        run: |
          mv frontend/.output/public/* ./
          rm -rf frontend
          rm -rf backend
          rm -rf .github
        shell: bash
      
      - name: Add CNAME and .nojekyll
        # .nojekyll turns off GitHub Pages' Jekyll build. Jekyll refuses to
        # publish anything whose name starts with an underscore, and Nuxt emits
        # two kinds of those: every route's `_payload.json`, and the chunk for
        # the `events/[slug].vue` route, which Rollup names `_slug_-<hash>.js`.
        # Both were being dropped silently, so an individual event page served
        # the SPA shell and then 404'd fetching its own route chunk.
        #
        # Created here rather than moved out of .output/public because the move
        # above globs `*`, which never matches a dotfile.
        run: |
          echo "chrispecmusic.com" > CNAME
          touch .nojekyll
        shell: bash
      
      - name: Commit and push changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Deploy"
          git push --force origin gh-pages